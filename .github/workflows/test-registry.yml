name: Test Registry Events
on:
  registry_package:
    types: [published, updated]  
  push: 
    branches: [main]

jobs:
  log:
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "Event: ${{ github.event_name }}"
          echo "Tag: ${{ github.event.registry_package.package_version.version }}"
          echo "Run ID: ${{ github.run_id }}"
